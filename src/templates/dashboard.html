<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Intelligence Dashboard</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0b0f19; 
            color: #f3f4f6; 
            padding: 24px; 
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            border-bottom: 1px solid #1f2937; 
            padding-bottom: 16px; 
        }
        .header h1 { 
            font-size: 24px; 
            color: #38bdf8; 
            font-weight: 600; 
        }
        .badge { 
            background: #1e293b; 
            padding: 6px 12px; 
            border-radius: 6px; 
            border: 1px solid #334155; 
            font-size: 14px; 
            color: #9ca3af; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 24px; 
        }
        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card { 
            background: #111827; 
            border: 1px solid #1f2937; 
            border-radius: 12px; 
            padding: 20px; 
        }
        .video-container { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #374151; 
        }
        .video-feed { 
            width: 100%; 
            max-height: 600px; 
            object-fit: contain; 
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1f2937;
        }
        .form-label {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
        }
        .form-input {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: #38bdf8;
        }
        .form-input[type="file"] {
            background: transparent;
            border: none;
            padding: 5px 0;
            color: #9ca3af;
            cursor: pointer;
        }
        .btn {
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-primary { background: #3b82f6; }
        .btn-success { background: #10b981; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 16px; 
            margin-top: 12px;
        }
        .stat-box { 
            background: #1f2937; 
            border-radius: 8px; 
            padding: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 4px solid #3b82f6; 
        }
        .stat-box.success { border-left-color: #10b981; }
        .stat-box.danger { border-left-color: #ef4444; }
        .stat-label { font-size: 14px; color: #9ca3af; }
        .stat-val { font-size: 24px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Vision Intelligence System</h1>
        <div class="badge">Course Work | Live Mode</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3 style="margin-bottom: 12px; color: #38bdf8;">Live Analytic Video Stream</h3>
            <div class="video-container">
                <img class="video-feed" src="/video_feed" alt="CONNECTING TO STREAM THREAD...">
            </div>
        </div>

        <div class="card">
            
            <h3 style="margin-bottom: 12px; color: #38bdf8;">Stream Configuration</h3>
            <form action="/api/change_camera" method="post" class="form-group">
                <span class="form-label">Source URL (RTSP / MJPEG Stream):</span>
                <input type="text" name="camera_url" class="form-input" value="{{ current_url }}" placeholder="http://192.168.1.X:8080/video" style="font-family: monospace;">
                <button type="submit" class="btn btn-primary">Apply Source</button>
            </form>

            <h3 style="margin-bottom: 12px; color: #38bdf8;">Register New Face</h3>
            <form action="/api/add_person" method="post" enctype="multipart/form-data" class="form-group">
                <span class="form-label">Person's Name:</span>
                <input type="text" name="name" class="form-input" placeholder="Elon Musk" required>
                
                <span class="form-label">Face Photo (.jpg / .png):</span>
                <input type="file" name="file" class="form-input" accept="image/*" required>
                
                <button type="submit" class="btn btn-success">Save to Database</button>
            </form>

            <h3>Real-time Metrics</h3>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Active Targets (YOLO)</span>
                    <span class="stat-val" id="stat-total">0</span>
                </div>
                <div class="stat-box success">
                    <span class="stat-label">Recognized Faces</span>
                    <span class="stat-val" id="stat-rec">0</span>
                </div>
                <div class="stat-box danger">
                    <span class="stat-label">Unknown / Checking</span>
                    <span class="stat-val" id="stat-unk">0</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Асинхронный опрос API для получения актуальной статистики без перезагрузки страницы
        setInterval(async () => {
            try {
                const response = await fetch('/api/stats');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('stat-total').innerText = data.total_persons ?? 0;
                    document.getElementById('stat-rec').innerText = data.recognized ?? 0;
                    document.getElementById('stat-unk').innerText = data.unknown ?? 0;
                }
            } catch (e) {
                console.error("Error fetching stats:", e);
            }
        }, 300); // Интервал обновления — 300мс
    </script>
</body>
</html>
